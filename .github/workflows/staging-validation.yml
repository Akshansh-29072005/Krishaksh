name: staging-validation

on:
  workflow_dispatch:
    inputs:
      run_staging_checks:
        description: Run staging validation checks
        required: true
        default: 'true'

jobs:
  staging-validation:
    if: inputs.run_staging_checks == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Build
        run: go build ./...
      - name: Validate env template fields
        run: grep -q "SERVER_ENV=staging" .env.staging.example
      - name: Validate runbooks exist
        run: |
          test -f deploy/runbooks/staging-checklist.md
          test -f deploy/runbooks/deployment-checklist.md
          test -f deploy/runbooks/rollback-checklist.md
      - name: Validate k6 scripts exist
        run: |
          test -f deploy/k6/staging-upload-concurrency.js
          test -f deploy/k6/staging-ai-queue-pressure.js
          test -f deploy/k6/staging-order-concurrency.js
          test -f deploy/k6/staging-webhook-concurrency.js
