version: '3.9'

x-common-env: &common-env
  SERVER_ENV: staging
  DATABASE_URL: ${DATABASE_URL}
  REDIS_ADDR: redis:6379
  JWT_SECRET: ${JWT_SECRET}
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
  GEMINI_API_KEY: ${GEMINI_API_KEY}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  AWS_REGION: ${AWS_REGION}
  S3_BUCKET: ${S3_BUCKET}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
  ENABLE_EMBEDDED_WORKER: "false"
  DB_MAX_CONNS: "20"
  DB_MIN_CONNS: "2"
  DB_CONN_MAX_LIFETIME: "1h"
  DB_CONN_MAX_IDLE_TIME: "30m"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      <<: *common-env
      SERVER_PORT: 8080
      RUN_DB_MIGRATIONS: "true"
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase_service_account.json
    secrets:
      - firebase_service_account
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ready || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      <<: *common-env
      RUN_DB_MIGRATIONS: "false"
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase_service_account.json
    secrets:
      - firebase_service_account
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_staging_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

secrets:
  firebase_service_account:
    file: ./deploy/secrets/firebase_service_account.json

volumes:
  redis_staging_data:
