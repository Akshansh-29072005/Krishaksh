user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

error_log /var/log/nginx/error.log warn;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format json_combined escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","request_id":"$request_id",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    'request_time":$request_time,"body_bytes_sent":$body_bytes_sent,"referer":"$http_referer",'
    '"user_agent":"$http_user_agent","x_forwarded_for":"$http_x_forwarded_for"}';

  access_log /var/log/nginx/access.log json_combined;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss application/xml image/svg+xml;

  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

  upstream api_upstream {
    server api:8080;
    keepalive 32;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # HTTP to HTTPS redirect
  server {
    listen 80 default_server;
    server_name api-krisho.aarcsx.com;

    location /nginx-health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'ok';
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS server
  server {
    listen 443 ssl http2 default_server;
    server_name api-krisho.aarcsx.com;

    # SSL Certificate paths (mount from deploy/nginx/certs/)
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # SSL Configuration (production-grade)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location /nginx-health {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'ok';
    }

    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://api_upstream;
    }
  }
}

