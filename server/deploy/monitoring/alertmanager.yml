global:
  resolve_timeout: 5m
  slack_api_url: "${SLACK_WEBHOOK_URL}"  # Set via environment variable

route:
  receiver: "default"
  group_by: ["alertname", "severity"]
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h

  routes:
    - match:
        severity: critical
      receiver: "critical"
      continue: true
    - match:
        severity: warning
      receiver: "warning"

receivers:
  - name: "default"
    slack_configs:
      - channel: "#krisho-alerts"
        title: "Krisho Production Alert"
        text: "{{ range .Alerts }}{{ .Annotations.summary }}: {{ .Annotations.description }}\n{{ end }}"

  - name: "critical"
    slack_configs:
      - channel: "#krisho-critical"
        title: "🚨 CRITICAL: Krisho Production Alert"
        text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}"

  - name: "warning"
    slack_configs:
      - channel: "#krisho-alerts"
        title: "⚠️ Warning: Krisho Alert"
        text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"

inhibit_rules:
  # Suppress warning alerts if critical alert is already firing
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname"]
