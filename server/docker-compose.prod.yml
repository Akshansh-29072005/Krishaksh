x-common-env: &common-env
  SERVER_ENV: production
  DATABASE_URL: "${DATABASE_URL}"
  DB_HOST: "${DB_HOST:-unused}"
  DB_USER: "${DB_USER:-unused}"
  DB_PASSWORD: "${DB_PASSWORD:-unused}"
  DB_NAME: "${DB_NAME:-unused}"
  REDIS_ADDR: redis:6379
  JWT_SECRET: ${JWT_SECRET}
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
  GEMINI_API_KEY: ${GEMINI_API_KEY}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  AWS_REGION: ${AWS_REGION}
  AWS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
  S3_BUCKET: ${S3_BUCKET}
  ENABLE_EMBEDDED_WORKER: "false"
  DB_MAX_CONNS: ${DB_MAX_CONNS:-15}
  DB_MIN_CONNS: ${DB_MIN_CONNS:-2}
  DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-15m}
  DB_CONN_MAX_IDLE_TIME: ${DB_CONN_MAX_IDLE_TIME:-5m}

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      <<: *common-env
      SERVER_PORT: 8080
      RUN_DB_MIGRATIONS: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase_service_account.json
    secrets:
      - firebase_service_account
    expose:
      - "8080"
    restart: unless-stopped
    stop_grace_period: 20s
    init: true
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 45s
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      <<: *common-env
      RUN_DB_MIGRATIONS: "false"
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase_service_account.json
    secrets:
      - firebase_service_account
    restart: unless-stopped
    stop_grace_period: 20s
    init: true
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

volumes:
  redis_data:
  nginx_logs:
  prometheus_data:

secrets:
  firebase_service_account:
    file: ./deploy/secrets/firebase_service_account.json
