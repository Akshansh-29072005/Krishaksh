version: '3.9'

x-common-env: &common-env
  SERVER_ENV: production
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT:-5432}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_NAME: ${DB_NAME}
  DB_SSLMODE: ${DB_SSLMODE:-require}
  REDIS_ADDR: redis:6379
  JWT_SECRET: ${JWT_SECRET}
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
  GEMINI_API_KEY: ${GEMINI_API_KEY}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  AWS_REGION: ${AWS_REGION}
  S3_BUCKET: ${S3_BUCKET}
  ENABLE_EMBEDDED_WORKER: "false"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      <<: *common-env
      SERVER_PORT: 8080
      RUN_DB_MIGRATIONS: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase_service_account.json
    secrets:
      - firebase_service_account
    expose:
      - "8080"
    restart: unless-stopped
    stop_grace_period: 20s
    init: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      <<: *common-env
      RUN_DB_MIGRATIONS: "false"
      FIREBASE_CREDENTIALS_PATH: /run/secrets/firebase_service_account.json
    secrets:
      - firebase_service_account
    restart: unless-stopped
    stop_grace_period: 20s
    init: true
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

volumes:
  redis_data:
  nginx_logs:
  prometheus_data:

secrets:
  firebase_service_account:
    file: ./deploy/secrets/firebase_service_account.json
