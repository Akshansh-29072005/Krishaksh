version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: krisho-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-krisho}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-krisho_pass}
      POSTGRES_DB: ${DB_NAME:-krisho_db}
    ports:
      - "5432:5432"
    volumes:
      - krisho-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krisho -d krisho_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  krisho-db-data:
