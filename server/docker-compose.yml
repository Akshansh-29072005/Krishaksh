version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: krishaksh-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-krishaksh}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-krishaksh_pass}
      POSTGRES_DB: ${DB_NAME:-krishaksh_db}
    ports:
      - "5432:5432"
    volumes:
      - krishaksh-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krishaksh -d krishaksh_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  krishaksh-db-data:
